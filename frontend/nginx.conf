server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Autoriser les requêtes jusqu'à 12 Mo, notamment les photos de profil.
    client_max_body_size 12M;

    # Gérer les routes du frontend JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Transmettre les appels API au serveur HTTP du backend Symfony.
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Transmettre les images et fichiers publics à Symfony.
    location /images/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
}