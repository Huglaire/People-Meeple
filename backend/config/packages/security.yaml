# yaml-language-server: $schema=../vendor/symfony/security-bundle/Resources/config/schema/security.schema.json

security:
    # Configuration du hashage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Fournisseur permettant de retrouver un utilisateur par son email
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Désactive la sécurité sur les outils de développement Symfony
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall dédié à la connexion et à la génération du JWT
        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker

            # Récupération de l'email et du mot de passe envoyés en JSON
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password

                # Génération du JWT après une authentification réussie
                success_handler: lexik_jwt_authentication.handler.authentication_success

                # Réponse envoyée en cas d'échec d'authentification
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall protégeant les routes de l'API avec un JWT
        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~

        # Firewall principal de Symfony
        main:
            lazy: true
            provider: app_user_provider

    # Définit les routes accessibles sans authentification
    access_control:
        # Inscription publique
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }

        # Connexion publique
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }

        # Réactivation publique
        - { path: ^/api/reactivate$, roles: PUBLIC_ACCESS }

        # Toutes les autres routes API nécessitent une authentification
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }